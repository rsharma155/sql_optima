# =============================================================================
# SQL Optima: TimescaleDB Docker Compose
# 
# This configuration starts:
#   1. TimescaleDB (metrics storage)
#   2. Schema Setup (creates tables, seeds data)
#   3. Backup Sidecar (automatic backups)
# =============================================================================

#version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB - Main metrics storage
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: dbmonitor_timescaledb
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${DB_USER:-dbmonitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      POSTGRES_DB: ${DB_NAME:-dbmonitor_metrics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=5000
      - -c
      - log_min_error_statement=error
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbmonitor} -d ${DB_NAME:-dbmonitor_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - dbmonitor_net
    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Schema Setup - Creates tables, indexes, and seeds data
  # Runs after TimescaleDB is healthy
  # ---------------------------------------------------------------------------
  schema-setup:
    image: postgres:16-alpine
    container_name: dbmonitor_schema_setup
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        echo "=============================================="
        echo "SQL Optima: Schema Setup Starting..."
        echo "=============================================="
        echo "Host: $$DB_HOST:$$DB_PORT"
        echo "Database: $$DB_NAME"
        echo ""
        echo "[1/6] Waiting for TimescaleDB to be ready..."
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do
          echo "  Waiting for TimescaleDB..."
          sleep 2
        done
        echo "  TimescaleDB is ready"
        sleep 2
        echo ""
        PSQL="psql -v ON_ERROR_STOP=1 -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME"
        echo "[2/7] Applying main TimescaleDB schema (consolidated)..."
        $$PSQL -f /sql_scripts/01_timescale_schema.sql
        echo "[3/7] Applying rule engine..."
        $$PSQL -f /sql_scripts/02_rule_engine.sql
        echo "[4/7] Applying additional PG rules..."
        $$PSQL -f /sql_scripts/03_additional_pg_rules.sql
        echo "[5/7] Applying alert engine schema..."
        $$PSQL -f /sql_scripts/04_alert_engine.sql
        echo "[6/7] Applying OS metrics collector..."
        $$PSQL -f /sql_scripts/05_os_metrics_collector.sql
        echo "[7/7] Seeding initial data and platform config patch..."
        $$PSQL -f /sql_scripts/06_seed_data.sql
        $$PSQL -f /sql_scripts/07_optima_server_dr_policy.sql
        echo ""

        echo "  Validation complete"
        echo ""
        echo "=============================================="
        echo "SQL Optima: Schema Setup Complete!"
        echo "=============================================="
        echo "Database is ready for metric collection!"

    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    networks:
      - dbmonitor_net

  # ---------------------------------------------------------------------------
  # Schema Patches - Idempotent upgrades (runs on every compose up)
  # ---------------------------------------------------------------------------
  schema-patches:
    image: postgres:16-alpine
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do sleep 2; done
        echo "Applying idempotent schema patches..."
        psql -v ON_ERROR_STOP=1 -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME \
          -f /sql_scripts/07_optima_server_dr_policy.sql
        echo "Schema patches complete."
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dbmonitor_net

  # ---------------------------------------------------------------------------
  # Backup Sidecar - Optional manual backup
  # Run manually: docker exec -it dbmonitor_backup /bin/sh
  # ---------------------------------------------------------------------------
  backup-sidecar:
    image: postgres:16-alpine
    container_name: dbmonitor_backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ./backups:/backups
    command: ["sleep", "infinity"]
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dbmonitor_net

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
volumes:
  timescaledb_data:
    driver: local

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  dbmonitor_net:
    driver: bridge
