# =============================================================================
# SQL Optima: TimescaleDB Docker Compose
# 
# This configuration starts:
#   1. TimescaleDB (metrics storage)
#   2. Schema Setup (creates tables, seeds data)
#   3. Backup Sidecar (automatic backups)
# =============================================================================

#version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB - Main metrics storage
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: dbmonitor_timescaledb
    environment:
      POSTGRES_USER: ${DB_USER:-dbmonitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      POSTGRES_DB: ${DB_NAME:-dbmonitor_metrics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbmonitor} -d ${DB_NAME:-dbmonitor_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dbmonitor_net
    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Schema Setup - Creates tables, indexes, and seeds data
  # Runs after TimescaleDB is healthy
  # ---------------------------------------------------------------------------
  schema-setup:
    image: postgres:16-alpine
    container_name: dbmonitor_schema_setup
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        echo "=============================================="
        echo "SQL Optima: Schema Setup Starting..."
        echo "=============================================="
        echo "Host: $$DB_HOST:$$DB_PORT"
        echo "Database: $$DB_NAME"
        echo ""
        echo "[1/11] Waiting for TimescaleDB to be ready..."
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do
          echo "  Waiting for TimescaleDB..."
          sleep 2
        done
        echo "  TimescaleDB is ready"
        sleep 2
        echo ""
        echo "[2/11] Applying main TimescaleDB schema..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/00_timescale_schema.sql || echo "  Note: Schema may already exist"
        echo "[3/11] Applying Enterprise Metrics V2..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/06_sqlserver_enterprise_metrics_v2.sql || echo "  Note: Enterprise V2 may already exist"
        echo "[4/11] Applying PG instance snapshot..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/07_pg_instance_snapshot.sql || echo "  Note: PG Instance Snapshot may already exist"
        echo "[5/11] Applying OS metrics collector (agent data)..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/05_os_metrics_collector.sql || echo "  Note: OS Collector schema may already exist"
        echo "[6/11] Applying PG memory intelligence..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/08_pg_memory_intelligence.sql || echo "  Note: Memory Intelligence schema may already exist"
        echo "[7/11] Applying new Postgres dashboards..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/09_new_postgres_dashboards.sql || echo "  Note: New Postgres dashboards may already exist"
        echo "[8/11] Applying PG control center views..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/10_pg_control_center_views.sql || echo "  Note: PG Control Center views may already exist"
        echo ""
        echo "[9/11] Applying rule engine and PG rules..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/02_rule_engine.sql || echo "  Note: Rule engine may already exist"
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/03_additional_pg_rules.sql || echo "  Note: PG rules may already exist"
        echo "  Rules applied"
        echo ""
        echo "[10/11] Applying alert engine schema..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/04_alert_engine.sql || echo "  Note: Alert engine may already exist"
        echo "  Alert engine schema applied"
        echo ""
        echo "[11/11] Seeding initial data..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/01_seed_data.sql || echo "  Note: Seed data may already exist"
        echo "  Seed data applied"
        echo ""
        echo "[12/11] Running system validation..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/SST.sql || echo "  Note: SST completed"

        echo "  Validation complete"
        echo ""
        echo "=============================================="
        echo "SQL Optima: Schema Setup Complete!"
        echo "=============================================="
        echo "Database is ready for metric collection!"

    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    networks:
      - dbmonitor_net

  # ---------------------------------------------------------------------------
  # Backup Sidecar - Optional manual backup
  # Run manually: docker exec -it dbmonitor_backup /bin/sh
  # ---------------------------------------------------------------------------
  backup-sidecar:
    image: postgres:16-alpine
    container_name: dbmonitor_backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ./backups:/backups
    command: ["sleep", "infinity"]
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dbmonitor_net

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
volumes:
  timescaledb_data:
    driver: local

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  dbmonitor_net:
    driver: bridge
