services:
  intelligence-report:
    build:
      context: ../intelligence-report
      dockerfile: docker/Dockerfile
    ports:
      - "8765:8765"
    environment:
      IntelligenceReportSqloptima_DATABASE_URL: "postgresql+psycopg2://${DB_USER:-dbmonitor}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-dbmonitor_metrics}"
      IntelligenceReportSqloptima_REDIS_URL: "redis://redis:6379/0"
      IntelligenceReportSqloptima_INTERNAL_API_TOKEN: "${INTERNAL_SERVICE_TOKEN:-change_me_internal_token}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ":8080"
      SQL_OPTIMA_DEPLOYMENT: ${SQL_OPTIMA_DEPLOYMENT:-docker}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-0}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-32chars-minimum-for-prod}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-sql-optima}
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      INTELLIGENCE_REPORT_URL: "http://intelligence-report:8765"
      INTELLIGENCE_REPORT_TOKEN: "${INTERNAL_SERVICE_TOKEN:-change_me_internal_token}"
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-dbmonitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      POSTGRES_DB: ${DB_NAME:-dbmonitor_metrics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=5000
      - -c
      - log_min_error_statement=error
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbmonitor} -d ${DB_NAME:-dbmonitor_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    command:
      - sh
      - -lc
      - |
        # If Vault is already initialized and sealed, unseal it automatically.
        # This uses the single unseal key approach acceptable for single-node dev/prod-lite deployments.
        vault server -config=/vault/config/vault.hcl &
        VAULT_PID=$$!
        sleep 2

        export VAULT_ADDR=http://127.0.0.1:8200

        # Initialize on first run; store unseal key to /vault/data/.unseal (on the persistent volume)
        if ! vault status 2>/dev/null | grep -q "Initialized.*true"; then
          echo "[vault-init] Initializing Vault for the first time..."
          vault operator init -key-shares=1 -key-threshold=1 -format=json > /vault/data/.init.json
          UNSEAL_KEY=$$(cat /vault/data/.init.json | grep unseal_keys_b64 | head -1 | tr -d ' ",' | cut -d: -f2 | tr -d '[]')
          ROOT_TOKEN=$$(cat /vault/data/.init.json | grep root_token | tr -d ' ",' | cut -d: -f2)
          echo "$$UNSEAL_KEY" > /vault/data/.unseal
          echo "$$ROOT_TOKEN"  > /vault/data/.root_token
          echo "[vault-init] Vault initialized. Root token stored to /vault/data/.root_token"
        fi

        # Unseal if sealed
        if vault status 2>/dev/null | grep -q "Sealed.*true"; then
          echo "[vault-init] Unsealing Vault..."
          vault operator unseal "$$(cat /vault/data/.unseal)"
        fi

        wait $$VAULT_PID
    volumes:
      - vault_data:/vault/data
      - ./vault-config.hcl:/vault/config/vault.hcl:ro
    healthcheck:
      test: ["CMD", "sh", "-lc", "VAULT_ADDR=http://127.0.0.1:8200 vault status -format=json | grep -q '\"sealed\":false'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  vault-setup:
    image: hashicorp/vault:latest
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-sql-optima}
    depends_on:
      vault:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        set -e
        export VAULT_ADDR="$$VAULT_ADDR"
        # Read the root token from the persistent volume written by the vault init step
        export VAULT_TOKEN=$$(cat /vault/data/.root_token 2>/dev/null || echo "${VAULT_TOKEN:-root}")
        echo "[vault-setup] Enabling transit engine (idempotent)..."
        vault secrets enable -path=transit transit >/dev/null 2>&1 || true
        vault write -f "transit/keys/$$VAULT_TRANSIT_KEY" >/dev/null 2>&1 || true
        echo "[vault-setup] Done."
    volumes:
      - vault_data:/vault/data:ro
    restart: "no"

  schema-setup:
    image: postgres:16-alpine
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../infrastructure/sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do
          echo "Waiting for TimescaleDB..."
          sleep 2
        done
        echo "[1/6] Applying TimescaleDB schema (consolidated)..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/01_timescale_schema.sql || true
        echo "[2/6] Applying rule engine..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/02_rule_engine.sql || true
        echo "[3/6] Applying additional PG rules..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/03_additional_pg_rules.sql || true
        echo "[4/6] Applying alert engine schema..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/04_alert_engine.sql || true
        echo "[5/6] Applying os metric collector..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/05_os_metrics_collector.sql || true
        echo "[6/6] Seeding initial data..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/06_seed_data.sql || true
        echo "[7/7] Applying Postgres Backup & DR schema..."
        psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -f /sql_scripts/07_pg_backup_dr.sql || true
        echo "Schema setup complete."
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

volumes:
  timescaledb_data: {}
  vault_data: {}
