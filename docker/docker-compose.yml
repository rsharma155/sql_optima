services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.compose-api
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ":8080"
      SQL_OPTIMA_DEPLOYMENT: ${SQL_OPTIMA_DEPLOYMENT:-docker}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      DISABLE_PUBLIC_SETUP: ${DISABLE_PUBLIC_SETUP:-1}
      # OS_METRICS_INGEST_ENABLED: set only in .env when forcing on (1) or off (0).
      # If unset, ingest is controlled from the UI (optima_platform_settings).
      JWT_SECRET: ${JWT_SECRET:-change-me-to-32chars-minimum-for-prod}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      # Leave VAULT_TOKEN unset in .env for Compose: token is read from vault_data (see VAULT_TOKEN_FILE).
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TOKEN_FILE: /vault/token/.root_token
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-sql-optima}
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
      schema-patches:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully
    volumes:
      - vault_data:/vault/token:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    # Avoid "could not resize shared memory segment" on Linux Docker (default shm is 64MB).
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${DB_USER:-dbmonitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      POSTGRES_DB: ${DB_NAME:-dbmonitor_metrics}
    # Not published by default. Dev quick start adds docker-compose.dev.yml (see start-dev.sh).
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=5000
      - -c
      - log_min_error_statement=error
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbmonitor} -d ${DB_NAME:-dbmonitor_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    entrypoint: ["/bin/sh", "/vault/scripts/vault-entrypoint.sh"]
    volumes:
      - vault_data:/vault/data
      - ./vault-config.hcl:/vault/config/vault.hcl:ro
      - ./scripts/vault-entrypoint.sh:/vault/scripts/vault-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "sh", "-lc", "VAULT_ADDR=http://127.0.0.1:8200 vault status 2>/dev/null | grep -q 'Sealed.*false'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s
    restart: unless-stopped

  vault-setup:
    image: hashicorp/vault:1.18
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-sql-optima}
    depends_on:
      vault:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        set -e
        export VAULT_ADDR="$$VAULT_ADDR"
        # Read the root token from the persistent volume written by the vault init step
        export VAULT_TOKEN=$$(cat /vault/data/.root_token 2>/dev/null || echo "${VAULT_TOKEN:-root}")
        chmod 644 /vault/data/.root_token 2>/dev/null || true
        echo "[vault-setup] Enabling transit engine (idempotent)..."
        vault secrets enable -path=transit transit >/dev/null 2>&1 || true
        vault write -f "transit/keys/$$VAULT_TRANSIT_KEY" >/dev/null 2>&1 || true
        echo "[vault-setup] Done."
    volumes:
      - vault_data:/vault/data:ro
    restart: "no"

  schema-setup:
    image: postgres:16-alpine
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../infrastructure/sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do
          echo "Waiting for TimescaleDB..."
          sleep 2
        done
        PSQL="psql -v ON_ERROR_STOP=1 -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME"
        echo "[1/7] Applying TimescaleDB schema (consolidated)..."
        $$PSQL -f /sql_scripts/01_timescale_schema.sql
        echo "[2/7] Applying rule engine..."
        $$PSQL -f /sql_scripts/02_rule_engine.sql
        echo "[3/7] Applying additional PG rules..."
        $$PSQL -f /sql_scripts/03_additional_pg_rules.sql
        echo "[4/7] Applying alert engine schema..."
        $$PSQL -f /sql_scripts/04_alert_engine.sql
        echo "[5/7] Applying OS metrics collector..."
        $$PSQL -f /sql_scripts/05_os_metrics_collector.sql
        echo "[6/7] Seeding initial data..."
        $$PSQL -f /sql_scripts/06_seed_data.sql
        echo "[7/7] Applying platform config patch (DR policy + notifications)..."
        $$PSQL -f /sql_scripts/07_optima_server_dr_policy.sql
        echo "Schema setup complete."
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  schema-patches:
    image: postgres:16-alpine
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-dbmonitor}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
      DB_NAME: ${DB_NAME:-dbmonitor_metrics}
      PGPASSWORD: ${DB_PASSWORD:-change_me_in_production_use_strong_password}
    volumes:
      - ../infrastructure/sql_scripts:/sql_scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$DB_PASSWORD"
        until pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME \
          -f /sql_scripts/07_optima_server_dr_policy.sql
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-setup:
        condition: service_completed_successfully
    restart: "no"

  # Cold storage stack (optional — not started by start-dev / default compose up)
  minio:
    profiles: ["cold-storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER:     ${COLD_STORAGE_ACCESS_KEY_ID:-sqloptima}
      MINIO_ROOT_PASSWORD: ${COLD_STORAGE_SECRET_ACCESS_KEY:-change_me_in_production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio-init:
    profiles: ["cold-storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000
          $${COLD_STORAGE_ACCESS_KEY_ID:-sqloptima}
          $${COLD_STORAGE_SECRET_ACCESS_KEY:-change_me_in_production} &&
        mc mb --ignore-existing local/${COLD_STORAGE_BUCKET:-sql-optima-cold} &&
        mc anonymous set none local/${COLD_STORAGE_BUCKET:-sql-optima-cold} &&
        echo 'MinIO bucket ready.'
      "
    restart: "no"

  nessie:
    profiles: ["cold-storage"]
    image: projectnessie/nessie:latest
    ports:
      - "${NESSIE_PORT:-19120}:19120"
    environment:
      QUARKUS_DATASOURCE_DB_KIND: h2
    restart: unless-stopped

  trino:
    profiles: ["cold-storage"]
    image: trinodb/trino:latest
    ports:
      - "${TRINO_PORT:-8081}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    restart: unless-stopped

volumes:
  timescaledb_data: {}
  vault_data: {}
  minio_data: {}
