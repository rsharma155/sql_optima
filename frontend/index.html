    <!-- Fonts & icons — vendored for air-gapped deployments -->
    <link rel="stylesheet" href="/js/vendor/fonts/fonts.css">
    <style>
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        body { font-family: var(--font-sans); }
        code, pre { font-family: var(--font-mono); }

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-server xl-icon logo-icon" id="brand-icon"></i>
                <h2>SQL_Optima</h2>
                <button type="button" class="btn btn-icon btn-sm sidebar-inline-toggle" id="sidebar-toggle-inline" title="Collapse sidebar" aria-label="Collapse sidebar" style="margin-left:auto;">
                    <span class="sidebar-toggle-glyph" aria-hidden="true">&lt;&lt;</span>
                </button>
            </div>

            <!-- Target Selection (Reverted to Sidebar) -->
            <div class="db-selector-wrapper custom-select-group" style="padding: 0.5rem 1.5rem 1rem 1.5rem;">
                <div>
                    <label for="instance-select" style="font-size:0.7rem;">Target Server Instance</label>
                    <select id="instance-select" class="custom-select"><option value="">Loading config...</option></select>
                </div>
                <div>
                    <label for="database-select" style="font-size:0.7rem;">Target Database</label>
                    <select id="database-select" class="custom-select"><option value="all">-- All Databases --</option></select>
                </div>
            </div>

            <!-- Placeholder until config loads; router.js replaces this when an instance is selected -->
            <ul class="nav-links" id="sidebar-nav" style="padding-top:0.25rem;">
                <li data-route="global" class="active"><i class="fa-solid fa-globe"></i> Global Estate Overview</li>
            </ul>

            <div class="sidebar-footer">
                <div class="theme-toggle-wrapper">
                    <i class="fa-solid fa-sun"></i>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider round"></span>
                    </label>
                    <i class="fa-solid fa-moon"></i>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Global header removed as requested. Time picker will be injected per-page. -->
            
            <!-- Dynamic Router Outlet -->
            <div class="views-container" id="router-outlet">
                <!-- Modules injected here -->
            </div>
        </main>
    </div>

    <!-- Hidden Time Picker Template for injection -->
    <template id="global-time-picker-template">
        <div class="glass-panel" style="padding: 0.2rem 0.5rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; border: 1px solid var(--border-color); flex-wrap: nowrap; overflow: hidden;">
            <label class="text-muted" style="margin:0; font-weight:600; text-transform:uppercase; font-size:0.6rem;">From</label>
            <input type="datetime-local" id="from-ts" style="background:transparent; border:none; color:inherit; font-size:0.7rem; width:9.5rem; padding:0;" />
            <label class="text-muted" style="margin:0; font-weight:600; text-transform:uppercase; font-size:0.6rem;">To</label>
            <input type="datetime-local" id="to-ts" style="background:transparent; border:none; color:inherit; font-size:0.7rem; width:9.5rem; padding:0;" />
            <button id="global-refresh-btn" class="btn btn-xs btn-accent" style="padding:2px 8px; min-width:auto;" title="Apply Range">Apply</button>
            <button id="global-reload-btn" class="btn btn-xs btn-outline" style="padding:2px 6px; min-width:auto;" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
        </div>
    </template>
