<!-- Global Estate Overview — Multi-Instance Dashboard -->
<div class="page-view active dashboard-sky-theme">
    <div class="page-title flex-between dashboard-page-title-compact">
        <div class="dashboard-title-line" style="flex:1; min-width:0;">
            <h1><i class="fa-solid fa-earth-americas text-accent"></i> Global Estate Overview</h1>
            <span class="subtitle">Real-time status of all monitored PostgreSQL and SQL Server targets</span>
        </div>
        <div class="flex-between dashboard-page-title-actions">
            <div class="search-container glass-panel rounded" style="display:flex; align-items:center; padding:0.25rem 0.75rem; gap:0.5rem; background:rgba(255,255,255,0.05); border:1px solid var(--border-color);">
                <i class="fa-solid fa-magnifying-glass text-muted" style="font-size:0.8rem;"></i>
                <input type="text" id="estateSearch" class="form-control form-control-sm" placeholder="Search instances..." style="border:none; background:transparent; padding:0; height:1.8rem; font-size:0.8rem; min-width:200px;" />
            </div>
            <button class="btn btn-sm btn-outline text-accent" id="estateRefresh"><i class="fa-solid fa-refresh"></i> Refresh</button>
        </div>
    </div>

    <!-- Multi-Engine Grid -->
    <div id="estateBody" class="mt-4">
        <div class="text-muted p-5 text-center">
            <i class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i>
            <div>Loading infrastructure map...</div>
        </div>
    </div>
</div>

<style>
    .estate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .estate-card { padding: 1.25rem; border-radius: 12px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid var(--border-color); position: relative; overflow: hidden; }
    .estate-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); border-color: var(--accent); }
    .estate-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--status-color, var(--text-muted)); opacity: 0.8; }
    
    .estate-card.up { --status-color: var(--success); }
    .estate-card.down { --status-color: var(--danger); }
    
    .estate-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .estate-card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .estate-card-type { font-size: 0.65rem; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; margin-top: 0.2rem; }
    
    .estate-card-stat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; font-size: 0.75rem; }
    .estate-card-stat-label { color: var(--text-muted); }
    .estate-card-stat-value { font-weight: 600; color: var(--text); }

    .estate-section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-top: 2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
</style>
