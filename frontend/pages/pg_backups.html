<div class="page-view active dashboard-sky-theme pg-backups-page">
    <!-- Header -->
    <div class="page-title flex-between dashboard-page-title-compact">
        <div class="dashboard-title-line" style="flex:1; min-width:0; display:flex; align-items:center; gap:1rem;">
            <button class="btn btn-secondary btn-sm" data-action="navigate-back" title="Back to Control Center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h1>Backup Timeline</h1>
                <span class="subtitle">Instance: ${inst.name} | Database: <span class="text-accent">${dbName}</span></span>
            </div>
        </div>
        
        <div class="dashboard-page-title-actions dashboard-pg-header-actions">
            <div class="dashboard-pg-header-primary">
                <div class="time-picker glass-panel p-2 rounded" style="display:flex; flex-wrap:wrap; align-items:center; gap:0.35rem 0.85rem; justify-content:flex-end;">
                    <span class="text-muted" style="font-size:0.75rem;">Last Update: <span id="pgLastRefreshTime">--:--:--</span></span>
                    <span class="text-muted" style="font-size:0.75rem;" id="pg-uptime">Loading...</span>
                    <span class="text-muted" style="font-size:0.75rem;" id="pg-version">Loading...</span>
                </div>
                <div class="glass-panel p-2 rounded" style="display:flex; align-items:center; gap:0.5rem; cursor:help;" id="pgHealthTooltipContainer">
                    <span class="text-muted" style="font-size:0.75rem;">Health</span>
                    <span id="pgHealthScoreBadge" class="badge badge-success" style="min-width:3.5rem; text-align:center;">--</span>
                </div>
                <button class="btn btn-sm btn-outline text-accent" data-action="call" data-fn="PgBackupsView" title="Force refresh the dashboard data."><i class="fa-solid fa-refresh"></i> Refresh</button>
            </div>
        </div>
    </div>

    <!-- ROW 1: Backup KPIs -->
    <div id="pgBackupRPOStrip" class="glass-panel dashboard-strip-panel mt-2">
        <div class="dashboard-strip-header">
            <h4><i class="fa-solid fa-shield-halved text-accent"></i> Backup & Recovery Readiness</h4>
        </div>
        <div class="dashboard-strip-metrics-row--4">
            <div class="strip-metric-cell" title="Last successful backup.">
                <div class="strip-metric-label">Last Backup</div>
                <div class="strip-metric-value" id="stat-last-backup">--</div>
            </div>
            <div class="strip-metric-cell" title="Current backup status.">
                <div class="strip-metric-label">Status</div>
                <div class="strip-metric-value" id="stat-backup-status">--</div>
            </div>
            <div class="strip-metric-cell" title="Total backup size.">
                <div class="strip-metric-label">Total Size</div>
                <div class="strip-metric-value" id="stat-backup-size">--</div>
            </div>
            <div class="strip-metric-cell" title="Recent failures.">
                <div class="strip-metric-label">Failures (24h)</div>
                <div class="strip-metric-value" id="stat-backup-failures">--</div>
            </div>
        </div>
    </div>

    <div class="glass-panel p-2 rounded" style="margin-top:0.75rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
        <div class="custom-select-group">
            <label class="text-muted" style="font-size:0.75rem;">Limit</label>
            <select id="pgBackupLimit" class="custom-select" style="font-size:0.7rem; padding:2px 5px;">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="250">250</option>
            </select>
        </div>
        <div class="custom-select-group" style="min-width:260px; flex:1;">
            <label class="text-muted" style="font-size:0.75rem;">Search</label>
            <input id="pgBackupSearch" class="custom-input" placeholder="Filter tools, status, etc." style="font-size:0.7rem; padding:2px 8px; width:100%;" />
        </div>
        <div class="text-muted" style="font-size:0.7rem;" id="pgBackupMeta">Loading…</div>
    </div>

    <div class="table-card glass-panel mt-3" style="padding:0.75rem;">
        <div class="card-header"><h3 style="font-size:0.85rem; margin:0;">Backup Runs</h3></div>
        <div class="table-responsive mt-2" style="max-height:500px; overflow:auto;">
            <table class="data-table" style="font-size:0.7rem;">
                <thead>
                    <tr>
                        <th style="min-width:110px;">Started</th>
                        <th style="min-width:110px;">Finished</th>
                        <th style="min-width:90px;">Status</th>
                        <th style="min-width:110px;">Tool</th>
                        <th style="min-width:120px;">Type</th>
                        <th style="min-width:110px;">Size</th>
                        <th>Error</th>
                    </tr>
                </thead>
                <tbody id="pgBackupTbody">
                    <tr><td colspan="7" class="text-center text-muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
