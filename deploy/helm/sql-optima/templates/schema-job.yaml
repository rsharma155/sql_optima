{{- if .Values.schemaJob.enabled }}
{{- $cmName := .Values.schemaJob.existingConfigMap | default (printf "%s-schema-sql" (include "sql-optima.fullname" .)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sql-optima.fullname" . }}-schema-r{{ .Release.Revision }}
  labels:
    {{- include "sql-optima.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-setup
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: {{ .Values.schemaJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.schemaJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sql-optima.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: schema-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-setup
          image: {{ .Values.schemaJob.image | quote }}
          imagePullPolicy: {{ .Values.schemaJob.imagePullPolicy }}
          env:
            - name: DB_HOST
              value: {{ include "sql-optima.timescaleHost" . | quote }}
            - name: DB_PORT
              value: {{ include "sql-optima.timescalePort" . | quote }}
            - name: DB_NAME
              value: {{ include "sql-optima.timescaleDatabase" . | quote }}
            - name: DB_USER
              value: {{ include "sql-optima.timescaleUser" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sql-optima.dbPasswordSecretName" . }}
                  key: {{ include "sql-optima.dbPasswordSecretKey" . }}
          volumeMounts:
            - name: sql-scripts
              mountPath: /sql_scripts
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for TimescaleDB at $DB_HOST:$DB_PORT..."
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                sleep 2
              done
              PSQL="psql -v ON_ERROR_STOP=1 -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME"
              echo "[1/7] Applying TimescaleDB schema..."
              $PSQL -f /sql_scripts/01_timescale_schema.sql
              echo "[2/7] Applying rule engine..."
              $PSQL -f /sql_scripts/02_rule_engine.sql
              echo "[3/7] Applying additional PG rules..."
              $PSQL -f /sql_scripts/03_additional_pg_rules.sql
              echo "[4/7] Applying alert engine schema..."
              $PSQL -f /sql_scripts/04_alert_engine.sql
              echo "[5/7] Applying OS metrics collector..."
              $PSQL -f /sql_scripts/05_os_metrics_collector.sql
              echo "[6/7] Seeding initial data..."
              $PSQL -f /sql_scripts/06_seed_data.sql
              echo "[7/7] Applying platform config patch..."
              $PSQL -f /sql_scripts/07_optima_server_dr_policy.sql
              echo "Schema setup complete."
          resources:
            {{- toYaml .Values.schemaJob.resources | nindent 12 }}
      volumes:
        - name: sql-scripts
          configMap:
            name: {{ $cmName | quote }}
{{- end }}
