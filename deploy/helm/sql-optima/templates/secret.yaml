{{- if not .Values.timescale.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sql-optima.fullname" . }}-secrets
  labels:
    {{- include "sql-optima.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "timescale.password or timescale.existingSecret is required" .Values.timescale.password | quote }}
  JWT_SECRET: {{ required "auth.jwtSecret or auth.existingSecret is required" .Values.auth.jwtSecret | quote }}
  {{- if .Values.vault.enabled }}
  VAULT_TOKEN: {{ required "vault token secret required when vault.enabled" .Values.vault.token | quote }}
  {{- end }}
{{- end }}
